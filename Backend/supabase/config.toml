[functions.create-tenant]
# The handler verifies the access token with Auth.getUser (supports signing keys).
verify_jwt = false

[functions.recovery-state]
# Private server-to-server secret checked by the handler; never a browser API.
verify_jwt = false

[functions.email-change]
# Private server-to-server secret; authenticated actions also verify the session.
verify_jwt = false

[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"
site_url = "https://final-spartment.vercel.app"
additional_redirect_urls = ["https://final-spartment.vercel.app/reset-password", "http://localhost:5173/reset-password", "http://127.0.0.1:5173/reset-password"]

[auth.email.template.recovery]
subject = "Your Spartment password reset request"
content_path = "./supabase/templates/recovery.html"
